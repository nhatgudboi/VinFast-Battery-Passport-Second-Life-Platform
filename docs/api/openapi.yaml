        anonymizedServiceTimeline:
          type: array
          items:
            type: object
            properties:
              eventDate: { type: string, format: date }
              eventType: { type: string, example: "ROUTINE_INSPECTION" }
              workshopCity: { type: string, example: "Hanoi" }
              sohRecorded: { type: number, format: float, example: 92.40 }

    # ----------------------------------------------------------------
    # GOVERNANCE & AUDIT DTOs
    # ----------------------------------------------------------------
    AuditLogItem:
      type: object
      required: [id, actorEmail, actorRole, clientIp, action, tableName, recordId, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actorEmail: { type: string, example: "lead.longbien@vinfast.vn" }
        actorRole: { type: string, example: "STATION_LEAD" }
        clientIp: { type: string, example: "14.162.140.28" }
        action: { $ref: '#/components/schemas/AuditActionEnum' }
        tableName: { type: string, example: "battery_swap_orders" }
        recordId: { type: string, example: "512" }
