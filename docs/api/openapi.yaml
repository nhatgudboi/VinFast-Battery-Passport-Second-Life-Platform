      properties:
        id: { type: integer, format: int64 }
        batterySerial: { type: string, example: "VF-BAT-VF8-2026-00088" }
        partnerName: { type: string, example: "GreenMetals Metallurgy Europe GmbH" }
        handoverManifestCode: { type: string, example: "MANIFEST-BM-2026-088" }
        passportLocked: { type: boolean, example: true }

    # ----------------------------------------------------------------
    # EXCEL IMPORT DTOs
    # ----------------------------------------------------------------
    ImportPreviewResponse:
      type: object
      required: [totalRowsFound, validRowsCount, invalidRowsCount, errorsSummary]
      properties:
        totalRowsFound: { type: integer, example: 150 }
        validRowsCount: { type: integer, example: 148 }
