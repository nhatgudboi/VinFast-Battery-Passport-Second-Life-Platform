    AllocateBessRequest:
      type: object
      required: [bessStationId, batteryId, slotNumber]
      properties:
        bessStationId: { type: integer, format: int64, example: 2 }
        batteryId: { type: integer, format: int64, example: 108 }
        slotNumber: { type: integer, example: 19 }

    BessAllocationResponse:
      type: object
      required: [id, bessStationCode, batterySerial, slotNumber, allocatedSoh, allocatedAt]
      properties:
        id: { type: integer, format: int64 }
        bessStationCode: { type: string, example: "VGREEN-BESS-HN01" }
        batterySerial: { type: string, example: "VF-BAT-VF8-2026-00892" }
        slotNumber: { type: integer, example: 19 }
        allocatedSoh: { type: number, format: float, example: 68.53 }
        allocatedAt: { type: string, format: date-time }

    RecyclingHandoverRequest:
      type: object
      required: [batteryId, partnerName, handoverDate, handoverManifestCode]
      properties:
        batteryId: { type: integer, format: int64, example: 88 }
        partnerName: { type: string, example: "GreenMetals Metallurgy Europe GmbH" }
        handoverDate: { type: string, format: date, example: "2026-10-15" }
