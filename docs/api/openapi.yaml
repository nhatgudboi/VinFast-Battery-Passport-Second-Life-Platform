        modelName: { $ref: '#/components/schemas/VehicleModelEnum' }
        cellChemistry: { $ref: '#/components/schemas/CellChemistryEnum' }
        nominalCapacityKwh: { type: number, format: float, example: 87.70 }
        currentSoh: { type: number, format: float, example: 92.40 }
        sohRating: { type: string, example: "HEALTHY", enum: [HEALTHY, WARNING, SECOND_LIFE_CANDIDATE, CRITICAL] }
        totalCycles: { type: integer, example: 280 }
        carbonFootprintKgCo2ePerKwh: { type: number, format: float, example: 72.50 }
        carbonClass: { type: string, example: "A" }
        recycledCobaltPercent: { type: number, format: float, example: 16.00 }
        recycledLithiumPercent: { type: number, format: float, example: 6.00 }
        recycledNickelPercent: { type: number, format: float, example: 18.00 }
        un383Certified: { type: boolean, example: true }
